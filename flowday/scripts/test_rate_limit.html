<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Limit Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .test-section {
            margin: 25px 0;
            padding: 20px;
            background: #f8f9fa;
            border-left: 5px solid #f5576c;
            border-radius: 8px;
        }

        button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 5px;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        .success {
            color: #10b981;
            background: #d1fae5;
            padding: 10px;
            border-radius: 6px;
            margin: 5px 0;
        }

        .error {
            color: #ef4444;
            background: #fee2e2;
            padding: 10px;
            border-radius: 6px;
            margin: 5px 0;
        }

        .warning {
            color: #f59e0b;
            background: #fef3c7;
            padding: 10px;
            border-radius: 6px;
            margin: 5px 0;
        }

        .progress {
            margin: 15px 0;
        }

        .progress-bar {
            height: 20px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            transition: width 0.3s;
        }

        .log {
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            background: #1e293b;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            margin: 3px 0;
        }

        .log-success {
            color: #10b981;
        }

        .log-error {
            color: #ef4444;
        }

        .log-info {
            color: #3b82f6;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚦 Rate Limit Tester</h1>
        <p class="subtitle">Test authentication endpoint rate limiting</p>

        <!-- Login Test -->
        <div class="test-section">
            <h3>Test 1: Login (Max 5/min)</h3>
            <button onclick="testLoginRateLimit()">🔥 Spam Login (10 requests)</button>
            <div id="login-progress" class="progress" style="display:none">
                <div class="progress-bar">
                    <div id="login-bar" class="progress-fill" style="width:0%"></div>
                </div>
                <span id="login-count">0/10</span>
            </div>
            <div id="login-result"></div>
        </div>

        <!-- Register Test -->
        <div class="test-section">
            <h3>Test 2: Register (Max 3/min)</h3>
            <button onclick="testRegisterRateLimit()">🔥 Spam Register (6 requests)</button>
            <div id="register-progress" class="progress" style="display:none">
                <div class="progress-bar">
                    <div id="register-bar" class="progress-fill" style="width:0%"></div>
                </div>
                <span id="register-count">0/6</span>
            </div>
            <div id="register-result"></div>
        </div>

        <!-- Forgot Password Test -->
        <div class="test-section">
            <h3>Test 3: Forgot Password (Max 3/min)</h3>
            <button onclick="testForgotPasswordRateLimit()">🔥 Spam Reset (6 requests)</button>
            <div id="forgot-progress" class="progress" style="display:none">
                <div class="progress-bar">
                    <div id="forgot-bar" class="progress-fill" style="width:0%"></div>
                </div>
                <span id="forgot-count">0/6</span>
            </div>
            <div id="forgot-result"></div>
        </div>

        <!-- Logs -->
        <div class="test-section">
            <h3>📋 Logs</h3>
            <button onclick="clearLogs()">Clear</button>
            <div id="logs" class="log"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api/v1';

        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.insertBefore(entry, logs.firstChild);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        async function testLoginRateLimit() {
            const resultDiv = document.getElementById('login-result');
            const progressDiv = document.getElementById('login-progress');
            const progressBar = document.getElementById('login-bar');
            const countSpan = document.getElementById('login-count');

            resultDiv.innerHTML = '';
            progressDiv.style.display = 'block';
            log('Starting login spam test...', 'info');

            let blocked = 0;
            let allowed = 0;

            for (let i = 1; i <= 10; i++) {
                countSpan.textContent = `${i}/10`;
                progressBar.style.width = `${(i / 10) * 100}%`;

                try {
                    const response = await fetch(`${API_URL}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: 'test@test.com', password: 'wrong' })
                    });

                    if (response.status === 429) {
                        blocked++;
                        log(`Request ${i}: ❌ BLOCKED (429)`, 'error');
                    } else {
                        allowed++;
                        log(`Request ${i}: ✅ Allowed (${response.status})`, 'success');
                    }
                } catch (err) {
                    log(`Request ${i}: Error - ${err.message}`, 'error');
                }

                await new Promise(r => setTimeout(r, 300));
            }

            resultDiv.innerHTML = `
                <p class="success">✅ Allowed: ${allowed} requests (Expected: ~5)</p>
                <p class="error">❌ Blocked: ${blocked} requests (Expected: ~5)</p>
                ${blocked >= 4 ? '<p class="success">🎉 Rate limiting is WORKING!</p>' : '<p class="warning">⚠️ Expected more blocks</p>'}
            `;
            log('Login test complete', 'info');
        }

        async function testRegisterRateLimit() {
            const resultDiv = document.getElementById('register-result');
            const progressDiv = document.getElementById('register-progress');
            const progressBar = document.getElementById('register-bar');
            const countSpan = document.getElementById('register-count');

            resultDiv.innerHTML = '';
            progressDiv.style.display = 'block';
            log('Starting register spam test...', 'info');

            let blocked = 0;
            let allowed = 0;

            for (let i = 1; i <= 6; i++) {
                countSpan.textContent = `${i}/6`;
                progressBar.style.width = `${(i / 6) * 100}%`;

                try {
                    const response = await fetch(`${API_URL}/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: `Test${Date.now()}`,
                            email: `test${Date.now()}@test.com`,
                            password: 'pass123'
                        })
                    });

                    if (response.status === 429) {
                        blocked++;
                        log(`Request ${i}: ❌ BLOCKED (429)`, 'error');
                    } else {
                        allowed++;
                        log(`Request ${i}: ✅ Allowed (${response.status})`, 'success');
                    }
                } catch (err) {
                    log(`Request ${i}: Error - ${err.message}`, 'error');
                }

                await new Promise(r => setTimeout(r, 300));
            }

            resultDiv.innerHTML = `
                <p class="success">✅ Allowed: ${allowed} requests (Expected: ~3)</p>
                <p class="error">❌ Blocked: ${blocked} requests (Expected: ~3)</p>
                ${blocked >= 2 ? '<p class="success">🎉 Rate limiting is WORKING!</p>' : '<p class="warning">⚠️ Expected more blocks</p>'}
            `;
            log('Register test complete', 'info');
        }

        async function testForgotPasswordRateLimit() {
            const resultDiv = document.getElementById('forgot-result');
            const progressDiv = document.getElementById('forgot-progress');
            const progressBar = document.getElementById('forgot-bar');
            const countSpan = document.getElementById('forgot-count');

            resultDiv.innerHTML = '';
            progressDiv.style.display = 'block';
            log('Starting forgot-password spam test...', 'info');

            let blocked = 0;
            let allowed = 0;

            for (let i = 1; i <= 6; i++) {
                countSpan.textContent = `${i}/6`;
                progressBar.style.width = `${(i / 6) * 100}%`;

                try {
                    const response = await fetch(`${API_URL}/auth/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: 'test@test.com' })
                    });

                    if (response.status === 429) {
                        blocked++;
                        log(`Request ${i}: ❌ BLOCKED (429)`, 'error');
                    } else {
                        allowed++;
                        log(`Request ${i}: ✅ Allowed (${response.status})`, 'success');
                    }
                } catch (err) {
                    log(`Request ${i}: Error - ${err.message}`, 'error');
                }

                await new Promise(r => setTimeout(r, 300));
            }

            resultDiv.innerHTML = `
                <p class="success">✅ Allowed: ${allowed} requests (Expected: ~3)</p>
                <p class="error">❌ Blocked: ${blocked} requests (Expected: ~3)</p>
                ${blocked >= 2 ? '<p class="success">🎉 Rate limiting is WORKING!</p>' : '<p class="warning">⚠️ Expected more blocks</p>'}
            `;
            log('Forgot password test complete', 'info');
        }

        log('Rate limit tester ready', 'info');
    </script>
</body>

</html>
